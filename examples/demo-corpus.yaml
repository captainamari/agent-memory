documents:
  - id: demo-retry-rule
    path: domains/parcels/2-rules/retry.md
    title: 虚构包裹查询的重试约束
    summary: 回执查询超时先核实原请求，重试沿用同一请求键。
    type: rule
    domain: parcels
    category: 2-rules
    aliases: [重复请求, 幂等约束]
    body: |
      ## 约束
      本演示的回执查询超时后，先核实原请求状态。不得把超时当作不存在，也不得重新创建包裹。重试沿用原请求键。
  - id: demo-timeout-runbook
    path: domains/parcels/4-runbooks/timeout.md
    title: 回执查询超时排查
    summary: 定位虚构包裹回执查询超时并检查请求键。
    type: runbook
    domain: parcels
    category: 4-runbooks
    aliases: [回执查询超时, 回执一直查不到]
    related: [demo-retry-rule]
    body: |
      ## 排查步骤
      查原请求状态，再检查查询链路。是否重试必须遵守 [重试规则](memory:demo-retry-rule#约束)。这是虚构示例，不对应真实服务。
  - id: demo-query-interface
    path: domains/parcels/7-interfaces/QueryParcelStatus.md
    title: 查询包裹回执接口
    summary: 用虚构请求键查询包裹回执状态。
    type: interface
    domain: parcels
    category: 7-interfaces
    aliases: [查包裹状态]
    symbols: [QueryParcelStatus]
    related: [demo-retry-rule]
    body: |
      ## 接口
      输入 request_key，输出 pending 或 acknowledged。该接口仅用于知识库演示，没有可调用服务。
